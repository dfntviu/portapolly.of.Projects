<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Portolio · Front-End · Developer(React · Vue · TypeScript) </title>
  <link rel="shortcut icon" href="/assets/icons/portafolio.png" type="image/x-icon">
  <meta name="description" content="Portafolio de Daniel, desarrollador Front-End con React, Vue 3 y TypeScript. Proyectos, tecnologías, CV y contacto.">
  <meta name="color-scheme" content="light dark">
  <!-- Aplica el tema antes de pintar para evitar el parpadeo claro→oscuro -->
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido" data-i18n="skip">Saltar al contenido</a>

  <header class="site-header">
    <nav class="container nav" aria-label="Principal">
      <a class="nav__brand" href="#inicio">Daniel Gómez Pérez<span class="nav__dot"></span></a>

      <ul class="nav__links">
        <li><a href="#proyectos"    data-i18n="nav.proyectos">Proyectos</a></li>
        <li><a href="#tecnologias"  data-i18n="nav.tecnologias">Tecnologías</a></li>
        <li><a href="#sobre-mi"     data-i18n="nav.sobreMi">Sobre mí</a></li>
        <li><a href="#formacion"    data-i18n="nav.formacion">Formación</a></li>
        <li><a href="#cv"           data-i18n="nav.cv">CV</a></li>
        <li><a href="#contacto"     data-i18n="nav.contacto">Contacto</a></li>
      </ul>

      <div class="nav__actions">
        <button type="button" class="icon-btn" id="lang-toggle" aria-label="Switch to English">EN</button>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Cambiar tema">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <!--
    Cada [data-section] se llena con templates/<idioma>/<nombre>.html.
    Si una plantilla falla, su hueco muestra el error en su lugar sin romper el resto.
  -->
  <main id="contenido">
    <div data-section="hero"></div>
    <div data-section="proyectos"></div>
    <div data-section="tecnologias"></div>
    <div data-section="sobre-mi"></div>
    <div data-section="estudios"></div>
    <div data-section="certificaciones"></div>
    <div data-section="cv"></div>
    <div data-section="contacto"></div>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> ·Daniel Gómez Pérez· <span data-i18n="footer.stack">HTML, CSS y JavaScript</span></div>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
